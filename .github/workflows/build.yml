name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: unzip -q football-career-sim.zip
      - name: Install dependencies
        working-directory: football-career-sim
        run: npm install
      - name: Install missing Expo package
        working-directory: football-career-sim
        run: npx expo install expo-asset
      - name: Generate Android project
        working-directory: football-career-sim
        run: npx expo prebuild --platform android
      - name: Set Kotlin version
        working-directory: football-career-sim/android
        run: echo "android.kotlinVersion=1.9.25" >> gradle.properties
      - name: Build APK
        working-directory: football-career-sim/android
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: football-career-apk
          path: football-career-sim/android/app/build/outputs/apk/release/app-release.apk
